name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  windows-sensor-bridge:
    name: Build Windows x64 sensor bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained Windows executable
        shell: pwsh
        run: |
          dotnet publish bridge/SurfaceSensors/SurfaceSensors.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test CLI
        shell: pwsh
        run: |
          ./dist/bridge/SurfaceSensors.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceSensors-win-x64
          path: dist/bridge/SurfaceSensors.exe
          if-no-files-found: error
          retention-days: 30
